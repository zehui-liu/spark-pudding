name: CI

on:
  push:
    branches: [main, v-1.0]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PUDDING_TESTCONTAINERS: "true"
      PUDDING_TESTCONTAINERS_REQUIRED: "true"
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: maven

      - name: Verify with container-backed integration tests
        run: mvn -B clean verify

  jdk-17-tests:
    name: Tests and CDC container regressions (JDK 17)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run tests without external containers
        run: mvn -B test

      - name: Run CDC source and lakehouse container regressions
        env:
          PUDDING_TESTCONTAINERS: "true"
          PUDDING_TESTCONTAINERS_REQUIRED: "true"
        run: |
          mvn -B -pl source/database-cdc-source -am test \
            -DwildcardSuites=org.pudding.source.cdc.MysqlCdcSourceTest,org.pudding.source.cdc.PostgresCdcSourceTest,org.pudding.source.cdc.MongodbCdcSourceTest
          mvn -B -pl integration/database-cdc-hudi-paimon-test -am test \
            -DwildcardSuites=org.pudding.integration.DatabaseCdcHudiPaimonTest
          mvn -B -pl integration/database-cdc-iceberg-test -am test \
            -DwildcardSuites=org.pudding.integration.DatabaseCdcIcebergTest

  compile:
    name: Compile (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        java: ["11", "17"]
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Compile main and test sources
        run: mvn -B test-compile
