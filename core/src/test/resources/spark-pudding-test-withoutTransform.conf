job {
  mode = "batch"
  appName = "spark test job"
  describe = "spark test job"
  sparkHome = "/opt/spark"
  sparkPuddingHome = "/opt/spark-pudding"
  master = "local[*]"
  deployMode = "client"
  config {
    "spark.master" = "local[*]"
    k2 = "v2"
  }
}

source = [
  {
    type = "hive"
    describe = "description information"
    id = "source1"
    config {
      hostname = "localhost"
      port = 3306
      username = "root"
      password = "123456"
      table = "app_db.test_table"
      path = "/user/bd/"
    }
  },
  {
    type = "hdfs"
    describe = "description information"
    id = "source2"
    config {
      path = "/data/test.csv"
    }
  }
]

sink = [
  {
    type = "mysql"
    describe = "mysql sink"
    id = "sink1"
    config {
      hostname = "localhost"
      port = 3306
      username = "root"
      password = "123456"
      database = "test"
      table = "test"
    }
    dependency = "source2"
  }
]
