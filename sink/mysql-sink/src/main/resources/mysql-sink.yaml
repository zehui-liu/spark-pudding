sink:
  - type: mysql-sink
    describe: batch, structured-streaming or sync-incremental write a DataFrame to MySQL
    id: sink1
    config:
      url: jdbc:mysql://<hostname>:<port>/<database_name>?useSSL=false&serverTimezone=UTC
      table: tbl
      user: <user>
      password: '<redacted>'
      # append, overwrite, ignore, error or errorifexists
      mode: append
      options:
        batchsize: '1000'
    dependency: transform1
