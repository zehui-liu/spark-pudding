job:
  mode: streaming
  appName: streaming-window-update
  master: local[*]
  deployMode: client
  sparkHome: "${SPARK_HOME}"
  sparkPuddingHome: "${PUDDING_HOME}"
  trigger: "processing-time: 30 seconds"

catalog:
  - name: lake
    type: iceberg
    properties:
      type: hadoop
      warehouse: "file:///tmp/pudding/iceberg"

source:
  - id: kafka_orders
    type: kafka-source
    config:
      kafkaBootstrapServers: "localhost:9092"
      subscribe: orders
      valueFormat: json
      valueSchema:
        order_id: long
        order_time: timestamp
        order_city: string
        amount: decimal(12,2)
      options:
        startingOffsets: earliest

transform:
  # Update output emits a changed row whenever an open window's aggregate changes. The sink
  # merges by recordKeyFields, so the key must identify the window and group.
  - id: window_count
    type: aggregate-transform
    dependencies: [kafka_orders]
    config:
      eventTime: order_time
      watermark: "10 minutes"
      window: "5 minutes"
      groupBy: [order_city]
      aggregations:
        order_count: "count(*)"
        total_amount: "sum(amount)"

sink:
  # Create this table before starting the job. Its columns must match the transform output:
  # window_start, window_end, order_city, order_count, total_amount.
  - id: window_output
    type: iceberg-sink
    dependency: window_count
    catalog: lake
    config:
      table: sales.order_window_count
      outputMode: update
      recordKeyFields: [window_start, window_end, order_city]
      checkpointLocation: "file:///tmp/pudding/checkpoints/window-update"
      checkpointRetention: keep
