job {
  mode = "batch"
  sparkHome = "/opt/spark"
  sparkPuddingHome = "/opt/spark-pudding"
  appName = "spark read csv example job"
  master = "yarn"
  deployMode = "client"
  describe = "spark test job"
}
sink = [
  {
    config {
      isStreaming = false
      numRows = 10
      printSchema = true
      truncate = 20
      vertical = false
    }
    dependency = source-1
    describe = "display the result on the console"
    id = sink1
    type = console-sink
  }
]
source = [
  {
    config {
      fileType = csv
      forceConvertSchema = true
      options {
        delimiter = ","
        header = "true"
      }
      path = "hdfs:///user/pudding/examples/data/demo.csv"
      schema {
        col1 = string
        col2 = string
        col3 = string
        col4 = string
      }
      streamRead = false
      textDelimiter = ","
    }
    describe = "read a CSV file"
    id = source-1
    type = file-common-source
  }
]