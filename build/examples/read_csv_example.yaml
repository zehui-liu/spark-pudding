job:
  mode: "batch"
  sparkHome: '/opt/spark'
  sparkPuddingHome: '/opt/spark-pudding'
  appName: 'spark read csv example job'
  master: yarn
  deployMode: client
  describe: spark test job
  config:
    spark.executor.memory: 512m
    spark.executor.cores: '1'
    spark.driver.memory: '512m'
    spark.driver.cores: '1'
    spark.executor.instances: '1'


source:
  - type: file-common-source
    describe: read a CSV file
    id: source-1
    config:
      path: hdfs:///user/pudding/examples/data/demo.csv
      fileType: csv
      streamRead: false
      textDelimiter: ','
      # dataframe force convert schema field and type，other field discard
      forceConvertSchema: true
      options:
        header: 'true'
        delimiter: ','
      schema:
        col1: string
        col2: string
        col3: string
        col4: string

sink:
  - type: console-sink
    describe: display the result on the console
    id: sink1
    config:
      isStreaming: false
      numRows: 10
      truncate: 20
      vertical: false
      printSchema: true
#      level: 0
    dependency: source-1