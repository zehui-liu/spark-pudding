job:
  mode: streaming
  appName: streaming-window-aggregate
  master: local[*]
  deployMode: client
  sparkHome: "${SPARK_HOME}"
  sparkPuddingHome: "${PUDDING_HOME}"
  trigger: "processing-time: 30 seconds"

source:
  - id: kafka_orders
    type: kafka-source
    config:
      kafkaBootstrapServers: "localhost:9092"
      subscribe: orders
      valueFormat: json
      valueSchema:
        order_id: long
        order_time: timestamp
        order_city: string
        amount: decimal(12,2)
      options:
        startingOffsets: earliest

transform:
  # Windows close when the watermark passes window_end. State is retained until then, so tune
  # watermark and window together.
  - id: window_count
    type: aggregate-transform
    dependencies: [kafka_orders]
    config:
      eventTime: order_time
      watermark: "10 minutes"
      window: "5 minutes"
      groupBy: [order_city]
      aggregations:
        order_count: "count(*)"
        total_amount: "sum(amount)"

sink:
  - id: window_output
    type: file-sink
    dependency: window_count
    config:
      path: "file:///tmp/pudding/window-aggregate"
      fileType: parquet
      outputMode: append
      checkpointLocation: "file:///tmp/pudding/checkpoints/window-aggregate"
      checkpointRetention: keep
