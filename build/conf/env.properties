# Entries in this file are exported to the Spark submission process.
# JAVA_HOME and SPARK_HOME select the runtime used by the client and drivers.
# JDK 11 or 17 is required; the default shell JDK 8 is not supported.
# JAVA_HOME=/usr/lib/jvm/java-11
# SPARK_HOME=/opt/spark
# Uncomment and set the cluster configuration directories for YARN.
# HADOOP_CONF_DIR=/path/to/hadoop/etc/hadoop
# YARN_CONF_DIR=/path/to/hadoop/etc/hadoop
