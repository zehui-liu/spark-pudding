source:
  - type: mysql-source
    describe: batch or sync-incremental read a MySQL table through Spark's JDBC data source
    id: source-1
    config:
      url: jdbc:mysql://<hostname>:<port>/<database_name>?<parameters>
      table: tbl
      user: <user>
      password: '<redacted>'
      options:
        fetchsize: '1000'
