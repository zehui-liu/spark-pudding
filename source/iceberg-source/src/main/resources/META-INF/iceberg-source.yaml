source:
  - type: iceberg-source
    describe: read an Iceberg table in batch, streaming or incremental mode
    id: source-1
    config:
      table: sales.orders
      # Set streamRead: true for Iceberg Structured Streaming snapshot reads.
      # streamRead: true
      # Optional batch time-travel selectors: snapshotId, asOfTimestamp, branch or tag.
      snapshotId: 123456789
      filterExpr: "dt >= '2026-01-01'"
      # Iceberg-specific reader options can be supplied under options.
      # Optional projection and type conversion.
      forceConvertSchema: false
      schema:
        id: string
        amount: double
