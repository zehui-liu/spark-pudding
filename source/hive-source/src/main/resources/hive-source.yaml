source:
  - type: hive-source
    describe: read a Hive table
    id: source-1
    config:
      table: test1
      conditionExpr: age > 21 and name = 'tom'
      # Optional projection and type conversion.
      forceConvertSchema: true
      schema:
        a1: string
        a2: double
        a3: date
        a4: int
