source:
  - type: file-common-source
    describe: read CSV, text, JSON, Parquet or ORC files from a Hadoop-compatible filesystem
    id: source-1
    config:
      # batch reads accept multiple comma-separated paths; streaming reads exactly one
      path: hdfs:///user/hive/test001.csv,hdfs:///user/hive/test002.csv
      fileType: csv
      # csv and json streams require schema; parquet, orc and text streams do not
      streamRead: false
      textDelimiter: ','
      # Project and cast to the configured schema; unlisted columns are dropped.
      forceConvertSchema: false
      options:
        header: true
        delimiter: ','
      schema:
        a1: string
        a2: double
        a3: date
        a4: int
