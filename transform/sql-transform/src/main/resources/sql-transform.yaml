transform:
  - type: sql-transform
    describe: run SQL over one or more dependency DataFrames
    id: transform1
    config:
      # Single dependency, keep using tempView:
      # tempView: tbl_temp
      #
      # Multiple dependencies, map every dependency id to a temp view name:
      tempViews:
        source1: tbl_temp
        source2: user_temp
      sql: 'select t.a, t.b, u.c from tbl_temp t join user_temp u on t.id = u.id'
      # Optional number of partitions for the SQL result.
      numPartitions: 300
    dependencies: [source1, source2]
