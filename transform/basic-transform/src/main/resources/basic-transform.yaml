transform:
  - type: filter-transform
    describe: keep orders above a threshold
    id: filter1
    dependencies: [source1]
    config:
      condition: "amount >= 100"
      numPartitions: 2

  - type: column-transform
    describe: select, rename and cast columns
    id: columns1
    dependencies: [filter1]
    config:
      fields:
        - order_id
        - name: user_name
          source: user_id
          type: string
        - name: amount
          type: string

  - type: aggregate-transform
    describe: aggregate by city
    id: aggregate1
    dependencies: [columns1]
    config:
      groupBy: [user_name]
      aggregations:
        - name: order_count
          expr: "count(*)"
        - name: total_amount
          expr: "sum(cast(amount as double))"

  - type: limit-transform
    describe: keep the first rows
    id: limit1
    dependencies: [aggregate1]
    config:
      limit: 100

